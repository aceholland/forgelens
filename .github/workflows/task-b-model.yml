name: Task B live model

on:
  workflow_dispatch:
    inputs:
      model:
        description: Open model to run on the standard CPU runner
        type: choice
        default: gpt-oss-20b
        options:
          - gpt-oss-20b
          - qwen3-coder-30b-a3b
          - qwen2-5-coder-7b
          - qwen2-5-coder-14b-desktop
          - ornith-1-5-9b-desktop
          - qwen3-coder-30b-a3b-desktop
      request_first_draft_tool:
        description: Ask the 7B draft model to use the native edit tool on its first request
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  flask:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      SOLVER_MODEL: ${{ inputs.model }}
      REQUEST_FIRST_DRAFT_TOOL: ${{ inputs.request_first_draft_tool && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Generate and independently grade the candidate
        run: bash checks/run-task-b-runner.sh
      - name: Preserve model and benchmark evidence
        if: always() && !endsWith(env.SOLVER_MODEL, '-desktop')
        uses: actions/upload-artifact@v4
        with:
          name: task-b-${{ env.SOLVER_MODEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/task-b-evidence/run.json
            ${{ runner.temp }}/task-b-evidence/result.json
            ${{ runner.temp }}/task-b-evidence/events.json
            ${{ runner.temp }}/task-b-evidence/candidate-verification.json
            ${{ runner.temp }}/task-b-evidence/candidate.patch
            ${{ runner.temp }}/task-b-evidence/provider-audit.json
      - name: Preserve desktop recording and receipts
        if: always() && endsWith(env.SOLVER_MODEL, '-desktop')
        uses: actions/upload-artifact@v4
        with:
          name: task-b-${{ env.SOLVER_MODEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/task-b-evidence/run.json
            ${{ runner.temp }}/task-b-evidence/native-replay.json
            ${{ runner.temp }}/task-b-evidence/model-receipt.json
            ${{ runner.temp }}/task-b-evidence/desktop.mp4
            ${{ runner.temp }}/task-b-evidence/desktop/result.json
            ${{ runner.temp }}/task-b-evidence/desktop/candidate.patch
            ${{ runner.temp }}/task-b-evidence/desktop/terminal-result.json
            ${{ runner.temp }}/task-b-evidence/desktop/independent/candidate-verification.json
            ${{ runner.temp }}/task-b-evidence/desktop/screens/*.png
            ${{ runner.temp }}/task-b-evidence/desktop/frames/*.jpg
