name: Supplemental local preview demonstration
on:
  push:
    branches: [codex/postdeadline-20261122]
    paths: ['.github/workflows/preview-demo.yml', 'checks/demo-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-linux-demo:
    if: github.ref == 'refs/heads/codex/postdeadline-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install public recording tools and build the current source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak xvfb fonts-dejavu-core
          npm ci --no-audit --no-fund
          npm run compile
          npm install --prefix "$RUNNER_TEMP/forge-demo-harness" --ignore-scripts --no-audit --no-fund '@vscode/test-electron@3.1.0' 'playwright-core@1.58.2'
      - name: Capture genuine desktop UI and narrate the verified local preview
        run: xvfb-run -a -s '-screen 0 1440x1000x24' node checks/demo-launch.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: forgelens-preview-demo
          path: ${{ runner.temp }}/forgelens-preview-demo/
          if-no-files-found: error
          retention-days: 7
