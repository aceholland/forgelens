name: Desktop VS Code and staged-edit checks

on:
  push:
    branches: [main, codex/task-b-workflow-20261122]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - id: package
        name: Build and identify the shared VSIX
        shell: bash
        run: |
          npm run package -- --out "$RUNNER_TEMP/forgelens.vsix"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/forgelens.vsix" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: forgelens-desktop-vsix
          path: ${{ runner.temp }}/forgelens.vsix
          if-no-files-found: error

  preview-without-provider:
    needs: build-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, editor: stable}
          - {os: windows-latest, editor: stable}
          - {os: macos-latest, editor: stable}
          - {os: ubuntu-latest, editor: '1.101.0'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      EDITOR_BUILD: ${{ matrix.editor }}
      FORGELENS_VSIX_SHA256: ${{ needs.build-package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: forgelens-desktop-vsix
          path: ${{ runner.temp }}/forge-package
      - name: Install candidate-validation test runner
        run: python -m pip install pytest==9.0.2
      - name: Run platform tests and install the isolated editor harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Join-Path $env:RUNNER_TEMP 'forge-preview-npm-cache'
          npm ci --no-audit --no-fund --cache "$cache"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --prefix "$env:RUNNER_TEMP/forge-preview-harness" --cache "$cache" --ignore-scripts --no-audit --no-fund '@vscode/test-electron@3.1.0' 'playwright-core@1.58.2'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install the shared VSIX and exercise the packaged extension
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node checks/desktop-preview-launch.cjs "$RUNNER_TEMP/forge-package/forgelens.vsix"
          else
            node checks/desktop-preview-launch.cjs "$RUNNER_TEMP/forge-package/forgelens.vsix"
          fi
