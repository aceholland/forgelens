name: Desktop VS Code and staged-edit checks

on:
  push:
    branches: [main, codex/task-b-workflow-20261122]
  workflow_dispatch:
    inputs:
      installer_run:
        description: 'Optional prior ForgeLens run whose exact installer should be retested'
        type: string
      installer_sha256:
        description: 'Expected SHA-256 of that prior installer'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-sandbox-review:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the local sandbox prerequisites and pinned TrueForge
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap socat ripgrep python3-venv
          npm ci --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/forge-native" --no-audit --no-fund @truefoundry/trueforge@0.185.1
      - name: Run the published skill and its Python MCP helper inside the native sandbox
        shell: bash
        run: TRUEFORGE_CLI="$RUNNER_TEMP/forge-native/node_modules/@truefoundry/trueforge/dist/cli.js" node --import tsx checks/native-review.ts

  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - if: inputs.installer_run != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.installer_run }}
          name: forgelens-desktop-vsix
          path: ${{ runner.temp }}/prior-installer
      - id: package
        name: Build and identify the shared VSIX
        shell: bash
        env:
          PRIOR_RUN: ${{ inputs.installer_run }}
          PRIOR_SHA: ${{ inputs.installer_sha256 }}
        run: |
          npm run package -- --out "$RUNNER_TEMP/forgelens.vsix"
          if [[ -n "$PRIOR_RUN" || -n "$PRIOR_SHA" ]]; then
            python checks/verify-prior-installer.py "$RUNNER_TEMP/forgelens.vsix" "$RUNNER_TEMP/prior-installer/forgelens.vsix" "$PRIOR_SHA"
            cp "$RUNNER_TEMP/prior-installer/forgelens.vsix" "$RUNNER_TEMP/forgelens.vsix"
          fi
          echo "sha256=$(sha256sum "$RUNNER_TEMP/forgelens.vsix" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: forgelens-desktop-vsix
          path: ${{ runner.temp }}/forgelens.vsix
          if-no-files-found: error

  preview-without-provider:
    needs: build-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, editor: stable}
          - {os: windows-latest, editor: stable}
          - {os: macos-latest, editor: stable}
          - {os: ubuntu-latest, editor: '1.101.0'}
          - {os: ubuntu-latest, editor: '1.95.0'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      EDITOR_BUILD: ${{ matrix.editor }}
      FORGELENS_VSIX_SHA256: ${{ needs.build-package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: forgelens-desktop-vsix
          path: ${{ runner.temp }}/forge-package
      - name: Install candidate-validation test runner
        run: python -m pip install pytest==9.0.2
      - name: Run platform tests and install the isolated editor harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Join-Path $env:RUNNER_TEMP 'forge-preview-npm-cache'
          npm ci --no-audit --no-fund --cache "$cache"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --prefix "$env:RUNNER_TEMP/forge-preview-harness" --cache "$cache" --ignore-scripts --no-audit --no-fund '@vscode/test-electron@3.1.0' 'playwright-core@1.58.2'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install the shared VSIX and exercise the packaged extension
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node checks/desktop-preview-launch.cjs "$RUNNER_TEMP/forge-package/forgelens.vsix"
          else
            node checks/desktop-preview-launch.cjs "$RUNNER_TEMP/forge-package/forgelens.vsix"
          fi

  live-review-with-trueforge:
    needs: build-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, editor: stable}
          - {os: macos-latest, editor: stable}
          - {os: ubuntu-latest, editor: '1.95.0'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      EDITOR_BUILD: ${{ matrix.editor }}
      FORGELENS_VSIX_SHA256: ${{ needs.build-package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: forgelens-desktop-vsix
          path: ${{ runner.temp }}/forge-package
      - name: Install the deterministic model fixture and desktop test dependencies
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          python -m pip install pytest==9.0.2
          npm install --prefix "$RUNNER_TEMP/forge-preview-harness" --no-audit --no-fund @vscode/test-electron@3.1.0 playwright-core@1.58.2 @truefoundry/trueforge@0.185.1
      - name: Verify native conversation compaction and read-only scout
        if: matrix.os == 'ubuntu-latest' && matrix.editor == 'stable'
        shell: bash
        run: TRUEFORGE_CLI="$RUNNER_TEMP/forge-preview-harness/node_modules/@truefoundry/trueforge/dist/cli.js" node --import tsx checks/native-scout.ts
      - name: Run pinned review skill and Code Mode in the native TrueForge sandbox
        if: matrix.os == 'macos-latest'
        shell: bash
        run: TRUEFORGE_CLI="$RUNNER_TEMP/forge-preview-harness/node_modules/@truefoundry/trueforge/dist/cli.js" node --import tsx checks/native-review.ts
      - name: Exercise installed VSIX, hunk decisions, candidate pytest and model feedback
        shell: bash
        run: |
          export FORGELENS_QA_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node checks/desktop-preview-launch.cjs "$RUNNER_TEMP/forge-package/forgelens.vsix" --live-review
          else
            node checks/desktop-preview-launch.cjs "$RUNNER_TEMP/forge-package/forgelens.vsix" --live-review
          fi
