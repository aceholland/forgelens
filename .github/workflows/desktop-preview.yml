name: Post-deadline source context preview in desktop VS Code

on:
  push:
    branches: [codex/postdeadline-20261122]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-without-provider:
    if: github.ref == 'refs/heads/codex/postdeadline-20261122'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, editor: stable}
          - {os: windows-latest, editor: stable}
          - {os: macos-latest, editor: stable}
          - {os: ubuntu-latest, editor: '1.101.0'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      EDITOR_BUILD: ${{ matrix.editor }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build current source and install the isolated editor harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Join-Path $env:RUNNER_TEMP 'forge-preview-npm-cache'
          npm ci --no-audit --no-fund --cache "$cache"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run compile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --prefix "$env:RUNNER_TEMP/forge-preview-harness" --cache "$cache" --ignore-scripts --no-audit --no-fund '@vscode/test-electron@3.1.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Activate 0.2.0 and preview a disposable Git workspace without a provider
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node checks/desktop-preview-launch.cjs
          else
            node checks/desktop-preview-launch.cjs
          fi
